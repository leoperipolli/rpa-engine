<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPA Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #ffffff;
      width: 260px;
      padding: 16px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #111;
    }

    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
      min-height: 16px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:not(:disabled):hover {
      opacity: 0.88;
    }

    #btn-start {
      background: #22c55e;
      color: #fff;
    }

    #btn-stop {
      background: #ef4444;
      color: #fff;
    }

    #btn-pick {
      background: #f97316;
      color: #fff;
    }

    #btn-export {
      background: #3b82f6;
      color: #fff;
    }

  </style>
</head>
<body>
  <h1>RPA Recorder</h1>
  <p class="status" id="status">Pronto</p>
  <div class="actions">
    <button id="btn-start">Iniciar Gravação</button>
    <button id="btn-stop" disabled>Parar</button>
    <button id="btn-pick" disabled>🎯 Selecionar elemento</button>
    <button id="btn-export" disabled>Exportar</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
